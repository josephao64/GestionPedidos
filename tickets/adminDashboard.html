<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Admin - Tickets (Kanban)</title>

		<!-- Bootstrap 5 CSS -->
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
		<link rel="stylesheet" href="adminDashboard.css">
	</head>
	<body>
		<div class="container-fluid vh-100 d-flex flex-column">
			<nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
				<div class="container-fluid">
					<div class="d-flex align-items-center">
						<button id="btnHome" class="btn btn-home" title="Ir al inicio">
							<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
								<path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.707 1.5Z"/>
								<path d="m8 3.293 6 6V13.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 4 13.5V9.293l6-6Z"/>
							</svg>
						</button>
					</div>
					<div class="d-flex align-items-center gap-3">
						<div class="search-container">
							<input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Buscar tickets...">
						</div>
						<button id="btnFilters" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1">
							<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
								<path d="M6 10.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5zm-2-3a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5zm-2-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5z"/>
							</svg>
							Filtros
						</button>
						<button id="btnAdd" class="btn btn-primary btn-sm">+ Nuevo Ticket</button>
					</div>
				</div>
			</nav>

			<main class="flex-fill overflow-auto pt-3">
				<div class="row flex-nowrap gx-3" id="board" style="min-width:900px;">
					<div class="col-12 col-sm-6 col-md-4">
						<div class="card h-100">
							<div class="card-header bg-primary text-white">Pendiente</div>
							<div class="card-body dropzone" data-status="todo" id="col-todo"></div>
						</div>
					</div>

					<div class="col-12 col-sm-6 col-md-4">
						<div class="card h-100">
							<div class="card-header bg-info text-white">En Progreso</div>
							<div class="card-body dropzone" data-status="inprogress" id="col-inprogress"></div>
						</div>
					</div>

					<div class="col-12 col-sm-6 col-md-4">
						<div class="card h-100">
							<div class="card-header bg-success text-white">Resuelto</div>
							<div class="card-body dropzone" data-status="done" id="col-done"></div>
						</div>
					</div>
				</div>
			</main>

			<!-- Modal Detalle Ticket -->
			<div class="modal fade" id="ticketModal" tabindex="-1" aria-hidden="true">
				<div class="modal-dialog modal-lg modal-dialog-centered">
					<div class="modal-content">
						<div class="modal-header border-bottom">
							<h5 class="modal-title fw-bold" id="modalTitle">Detalle Ticket</h5>
							<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
						</div>
						<div class="modal-body">
							<form id="modalForm">
								<input type="hidden" id="modalId" />
								<div class="row g-3 mb-3">
									<div class="col-md-6">
										<label class="form-label small text-muted">Sucursal</label>
										<input id="modalSucursal" type="text" class="form-control form-control-sm" readonly>
									</div>
									<div class="col-md-6">
										<label class="form-label small text-muted">Fecha</label>
										<input id="modalDate" type="text" class="form-control form-control-sm" readonly>
									</div>
								</div>
								<div class="mb-3">
									<label class="form-label small text-muted">Título</label>
									<input id="modalTitleInput" type="text" class="form-control" required>
								</div>
								<div class="mb-3">
									<label class="form-label small text-muted">Categoría</label>
									<input id="modalCategory" type="text" class="form-control">
								</div>
								<div class="mb-3">
									<label class="form-label small text-muted">Descripción</label>
									<textarea id="modalDescription" class="form-control" rows="4"></textarea>
								</div>
								<div id="modalImageWrapper" class="mb-3 text-center" style="display:none;">
									<img id="modalImage" class="img-fluid rounded shadow-sm" alt="Adjunto" style="max-height:300px;">
								</div>
								<div class="row g-2 mb-3">
									<div class="col-md-4">
										<label class="form-label small text-muted">Prioridad</label>
										<select id="modalPriority" class="form-select form-select-sm">
											<option value="low">🔵 Baja</option>
											<option value="normal">🟡 Normal</option>
											<option value="urgent">🔴 Urgente</option>
										</select>
									</div>
									<div class="col-md-4">
										<label class="form-label small text-muted">Asignado a</label>
										<input id="modalAssigned" type="text" class="form-control form-control-sm">
									</div>
									<div class="col-md-4">
										<label class="form-label small text-muted">Estado</label>
										<select id="modalStatus" class="form-select form-select-sm">
											<option value="todo">Pendiente</option>
											<option value="inprogress">En Progreso</option>
											<option value="done">Resuelto</option>
										</select>
									</div>
								</div>
								<hr class="my-4">
								<h6 class="mb-3 fw-semibold">Comentarios</h6>
								<div id="modalComments" class="mb-3 p-3 bg-light rounded" style="max-height:250px;overflow-y:auto;">
									<div class="text-muted small text-center py-3">Sin comentarios</div>
								</div>
								<div class="input-group mb-0">
									<input id="newComment" type="text" class="form-control form-control-sm" placeholder="Añadir comentario...">
									<button id="btnAddComment" type="button" class="btn btn-primary btn-sm">Enviar</button>
								</div>
							</form>
						</div>
						<div class="modal-footer border-top bg-light">
							<button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
							<button id="btnSaveTicket" type="button" class="btn btn-primary btn-sm">Guardar cambios</button>
						</div>
					</div>
				</div>
			</div>

			<!-- Modal Crear Ticket -->
			<div class="modal fade" id="createModal" tabindex="-1" aria-hidden="true">
				<div class="modal-dialog modal-lg modal-dialog-centered">
					<div class="modal-content">
						<div class="modal-header">
							<h5 class="modal-title">Crear Ticket</h5>
							<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
						</div>
						<div class="modal-body">
							<form id="createForm">
								<div class="mb-3">
									<label class="form-label">Título</label>
									<input id="inputTitle" type="text" class="form-control" required maxlength="80">
								</div>
								<div class="mb-3">
									<label class="form-label">Descripción</label>
									<textarea id="inputDesc" class="form-control" rows="4" required minlength="10"></textarea>
								</div>
								<div class="row g-2">
									<div class="col-md-4">
										<label class="form-label">Prioridad</label>
										<select id="inputPriority" class="form-select">
											<option value="low">Baja</option>
											<option value="normal" selected>Normal</option>
											<option value="high">Alta</option>
										</select>
									</div>
									<div class="col-md-4">
										<label class="form-label">Asignado a</label>
										<input id="inputAssigned" type="text" class="form-control">
									</div>
									<div class="col-md-4">
										<label class="form-label">Adjuntar imagen (opcional)</label>
										<input id="inputImage" type="file" accept="image/*" class="form-control">
									</div>
								</div>
							</form>
						</div>
						<div class="modal-footer">
							<button id="btnCreate" type="button" class="btn btn-primary">Crear</button>
							<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
						</div>
					</div>
				</div>
			</div>

			<!-- Modal Filtros -->
			<div class="modal fade" id="filtersModal" tabindex="-1" aria-hidden="true">
				<div class="modal-dialog modal-dialog-centered">
					<div class="modal-content">
						<div class="modal-header border-bottom">
							<h5 class="modal-title fw-bold">Filtros</h5>
							<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
						</div>
						<div class="modal-body">
							<form id="filtersForm">
								<div class="mb-3">
									<label class="form-label small text-muted">Tipo de Ticket</label>
									<select id="filterStatus" class="form-select form-select-sm">
										<option value="">Todos</option>
										<option value="todo">Pendiente</option>
										<option value="inprogress">En Progreso</option>
										<option value="done">Resuelto</option>
									</select>
								</div>
								<div class="mb-3">
									<label class="form-label small text-muted">Prioridad</label>
									<select id="filterPriority" class="form-select form-select-sm">
										<option value="">Todas</option>
										<option value="urgent">🔴 Urgente</option>
										<option value="normal">🟡 Normal</option>
										<option value="low">🔵 Baja</option>
									</select>
								</div>
								<div class="mb-3">
									<label class="form-label small text-muted">Sucursal</label>
									<select id="filterSucursal" class="form-select form-select-sm">
										<option value="">Todas</option>
									</select>
								</div>
								<div class="mb-3">
									<label class="form-label small text-muted">Categoría/Tipo</label>
									<select id="filterCategory" class="form-select form-select-sm">
										<option value="">Todas</option>
									</select>
								</div>
								<div class="mb-3">
									<label class="form-label small text-muted">ID Ticket</label>
									<input type="number" id="filterTicketId" class="form-control form-control-sm" placeholder="Buscar por ID..." min="1">
								</div>
							</form>
						</div>
						<div class="modal-footer border-top bg-light">
							<button type="button" class="btn btn-secondary btn-sm" id="btnClearFilters">Limpiar</button>
							<button type="button" class="btn btn-primary btn-sm" id="btnApplyFilters">Aplicar Filtros</button>
						</div>
					</div>
				</div>
			</div>

		</div>

		<!-- Bootstrap 5 JS (Popper incluido) -->
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
		<!-- Firebase SDKs (v8 namespace) -->
		<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
		<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
		<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-storage.js"></script>
		<!-- Conexión a Firebase (inicializa db y storage en window) -->
		<script src="../database/connection.js"></script>
		<script src="adminDashboard.js"></script>
		<script>
		// Notificaciones de nuevos tickets también en el dashboard admin
		(function(){
		  const notifIcon = '../resources/images/logo.png';
		  const notified = new Set();
		  function requestPerm(){
		    if(!('Notification' in window)) return Promise.resolve('unsupported');
		    if(Notification.permission==='granted') return Promise.resolve('granted');
		    if(Notification.permission==='denied') return Promise.resolve('denied');
		    return Notification.requestPermission();
		  }
		  function notifyTicket(d){
		    if(!('Notification' in window) || Notification.permission!=='granted') return;
		    const title = `Nuevo Ticket: ${d.ticketId||'Ticket'}`;
		    const body = `${d.sucursalName? d.sucursalName+' · ' : ''}${d.area||''}${d.subCategory? ' - '+d.subCategory:''}`.trim();
		    try{ new Notification(title,{ body, icon: notifIcon }); }catch(_e){}
		  }
		  document.addEventListener('DOMContentLoaded', function(){
		    requestPerm().then((perm)=>{
		      if(perm!=='granted' || !window.db) return;
		      const startMs = Date.now();
		      try{
		        window.ticketsUnsubNotify && window.ticketsUnsubNotify();
		      }catch(_){ }
		      try{
		        window.ticketsUnsubNotify = window.db.collection('tickets')
		          .orderBy('createdAt','desc')
		          .limit(25)
		          .onSnapshot((snap)=>{
		            snap.docChanges().forEach((chg)=>{
		              if(chg.type!=='added') return;
		              const doc = chg.doc; const data = doc.data()||{};
		              if(notified.has(doc.id)) return;
		              const ts = data.createdAt && data.createdAt.toDate ? data.createdAt.toDate().getTime() : Date.parse(data.createdAtLocal||0);
		              if(!ts || ts + 2000 < startMs){ notified.add(doc.id); return; }
		              notified.add(doc.id);
		              notifyTicket(data);
		            });
		          }, (err)=>console.warn('onSnapshot tickets error:',err));
		      }catch(e){ console.warn('init notif tickets:', e); }
		    });
		  });
		})();
		</script>
	</body>
</html>
