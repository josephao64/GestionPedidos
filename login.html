<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <!-- Biblioteca CryptoJS para Hashing de Contraseñas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background-color: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
        }
        .login-container h2 {
            margin-bottom: 20px;
        }
        .login-container select,
        .login-container input[type="password"] {
            width: 100%;
            padding: 12px 20px;
            margin: 8px 0 16px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .login-container button {
            width: 100%;
            background-color: #4CAF50;
            color: white;
            padding: 14px 20px;
            margin: 8px 0 12px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .login-container button:hover {
            background-color: #45a049;
        }
        .create-admin-btn {
            background-color: #f44336;
        }
        .create-admin-btn:hover {
            background-color: #da190b;
        }
        .message {
            color: green;
            margin-bottom: 15px;
        }
        .error-message {
            color: red;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Iniciar Sesión</h2>
    <div id="message" class="message"></div>
    <div id="error" class="error-message"></div>
    <form id="login-form">
        <label for="user-select">Selecciona tu Usuario</label>
        <select id="user-select" required>
            <option value="" disabled selected>-- Elige un Usuario --</option>
        </select>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Tu contraseña" required>

        <button type="submit">Ingresar</button>
    </form>
    <button id="create-admin" class="create-admin-btn">Crear Usuario Admin (Temporal)</button>
</div>

<script>
    // Configuración de Firebase
    var firebaseConfig = {
        apiKey: "AIzaSyBNalkMiZuqQ-APbvRQC2MmF_hACQR0F3M",
        authDomain: "logisticdb-2e63c.firebaseapp.com",
        projectId: "logisticdb-2e63c",
        storageBucket: "logisticdb-2e63c.appspot.com",
        messagingSenderId: "917523682093",
        appId: "1:917523682093:web:6b03fcce4dd509ecbe79a4"
    };
    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Referencias a elementos del DOM
    const userSelect = document.getElementById('user-select');
    const loginForm = document.getElementById('login-form');
    const messageDiv = document.getElementById('message');
    const errorDiv = document.getElementById('error');
    const createAdminBtn = document.getElementById('create-admin');

    // Función para cargar usuarios desde Firestore
    function loadUsers() {
        db.collection('usuarios').get()
            .then((querySnapshot) => {
                userSelect.innerHTML = '<option value="" disabled selected>-- Elige un Usuario --</option>'; // Resetear opciones
                querySnapshot.forEach((doc) => {
                    const user = doc.data();
                    const option = document.createElement('option');
                    option.value = user.username;
                    option.textContent = user.username;
                    userSelect.appendChild(option);
                });
            })
            .catch((error) => {
                console.error("Error al cargar usuarios: ", error);
                errorDiv.textContent = "Error al cargar usuarios.";
            });
    }

    // Cargar usuarios al cargar la página
    window.onload = loadUsers;

    // Manejar el inicio de sesión
    loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const selectedUsername = userSelect.value;
        const enteredPassword = loginForm.password.value;

        if (selectedUsername) {
            // Buscar el usuario en Firestore
            db.collection('usuarios').where('username', '==', selectedUsername).limit(1).get()
                .then((querySnapshot) => {
                    if (!querySnapshot.empty) {
                        const userDoc = querySnapshot.docs[0];
                        const userData = userDoc.data();
                        // Hash de la contraseña ingresada
                        const hashedEnteredPassword = CryptoJS.SHA256(enteredPassword).toString();
                        if (userData.password === hashedEnteredPassword) {
                            // Contraseña correcta
                            localStorage.setItem('usuarioLogueado', selectedUsername);
                            window.location.href = 'index.html';
                        } else {
                            // Contraseña incorrecta
                            errorDiv.textContent = "Contraseña incorrecta.";
                        }
                    } else {
                        // Usuario no encontrado
                        errorDiv.textContent = "Usuario no encontrado.";
                    }
                })
                .catch((error) => {
                    console.error("Error al verificar el usuario: ", error);
                    errorDiv.textContent = "Error al verificar el usuario.";
                });
        } else {
            errorDiv.textContent = "Por favor, selecciona un usuario.";
        }
    });

    // Manejar la creación del usuario admin temporal
    createAdminBtn.addEventListener('click', function() {
        const adminUsername = 'admin';
        const adminPassword = '123';
        const hashedAdminPassword = CryptoJS.SHA256(adminPassword).toString();
        const adminData = {
            username: adminUsername,
            password: hashedAdminPassword,
            rol: 'administrador',
            sucursalId: 'default_sucursal' // Asegúrate de tener una sucursal por defecto creada en tu colección 'sucursales'
        };

        // Verificar si el usuario admin ya existe
        db.collection('usuarios').where('username', '==', adminData.username).limit(1).get()
            .then((querySnapshot) => {
                if (!querySnapshot.empty) {
                    messageDiv.textContent = 'El usuario admin ya existe.';
                } else {
                    // Crear el usuario admin
                    db.collection('usuarios').add(adminData)
                        .then(() => {
                            messageDiv.textContent = 'Usuario admin creado exitosamente.';
                            // Actualizar la lista de usuarios
                            const option = document.createElement('option');
                            option.value = adminData.username;
                            option.textContent = adminData.username;
                            userSelect.appendChild(option);
                            // Deshabilitar el botón después de crear el admin
                            createAdminBtn.disabled = true;
                            createAdminBtn.textContent = "Admin Creado";
                        })
                        .catch((error) => {
                            console.error("Error al crear el usuario admin: ", error);
                            errorDiv.textContent = "Error al crear el usuario admin.";
                        });
                }
            })
            .catch((error) => {
                console.error("Error al verificar si el admin existe: ", error);
                errorDiv.textContent = "Error al verificar el usuario admin.";
            });
    });
</script>

</body>
</html>
