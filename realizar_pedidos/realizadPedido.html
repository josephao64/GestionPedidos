<!-- realizar_pedidos/realizadPedido.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Realizar Pedido</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
  
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <!-- html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <!-- Enlace a estilos específicos -->
  <link rel="stylesheet" href="styles.css">
  
  <!-- Tu archivo JS con la lógica -->
  <script defer src="app.js"></script>
</head>
<body>

  <h1>Realizar Pedido</h1>

  <!-- Botón para regresar al menú principal -->
  <div style="text-align: center; margin-bottom: 20px;">
    <button id="backButton">Regresar al Menú Principal</button>
  </div>

  <!-- Contenedor del formulario de creación de pedido (visible por defecto) -->
  <div id="orderCreationContainer" class="container">
    
    <!-- Formulario de datos generales del pedido -->
    <div class="order-form">
      <div class="form-group">
        <label for="newOrderProviderSelect">Seleccione Proveedor</label>
        <select id="newOrderProviderSelect" onchange="loadNewOrderProducts()"></select>
      </div>
      <div class="form-group">
        <label for="newOrderSucursalSelect">Seleccione Sucursal</label>
        <!-- Este select se llena dinámicamente: 
             - Si es admin: todas las sucursales
             - Si es usuario normal: su sucursal fija -->
        <select id="newOrderSucursalSelect"></select>
      </div>
      <div class="form-group">
        <label for="orderDate">Fecha de Pedido</label>
        <input type="date" id="orderDate">
      </div>
      <div class="form-group">
        <label for="orderId">ID Pedido</label>
        <input type="text" id="orderId" placeholder="ID Pedido" readonly>
      </div>
    </div>

    <!-- Sección para añadir productos al pedido -->
    <div class="product-form-and-table">
      <div class="product-form-container">
        <div class="product-form-group">
          <!-- Botón para abrir el modal de selección de producto -->
          <button onclick="showProductSelectionModal()">Seleccionar Producto</button>
        </div>
        <div class="product-form-group">
          <label for="productNameSelected">Producto</label>
          <input type="text" id="productNameSelected" placeholder="Producto" readonly>
        </div>
        <div class="product-form-group">
          <label for="productPresentationSelected">Presentación</label>
          <input type="text" id="productPresentationSelected" placeholder="Presentación" readonly>
        </div>
        <div class="product-form-group">
          <label for="productQuantity">Cantidad Pedido</label>
          <input type="number" id="productQuantity" placeholder="Cantidad Pedido">
        </div>
        <div class="product-form-group">
          <label for="productStock">Stock Actual</label>
          <input type="number" id="productStock" placeholder="Stock Actual">
          <label>
            <input type="checkbox" id="stockNA"> N/A
          </label>
        </div>
        <div class="product-form-group">
          <!-- Botón para agregar producto a la tabla -->
          <button onclick="addProductToNewOrder()">Agregar</button>
        </div>
      </div>

      <div class="table-wrapper">
        <table id="newOrderTable">
          <thead>
            <tr>
              <th>Producto</th>
              <th>Presentación</th>
              <th>Cantidad Pedido</th>
              <th>Stock</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- Botón para guardar el pedido -->
    <button class="save-order-button" onclick="saveNewOrder()">Guardar Pedido</button>
  </div>

  <!-- Modal para la selección de productos -->
  <div id="productSelectionModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeProductSelectionModal()">&times;</span>
      <h2>Seleccionar Productos</h2>
      <table id="productSelectionTable">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Presentación</th>
            <th>Acción</th>
          </tr>
          <tr>
            <th>
              <input 
                type="text" 
                id="productSearch" 
                onkeyup="filterProducts()" 
                placeholder="Buscar Producto..."
              >
            </th>
            <th></th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- Contenedor oculto para generar la imagen/ticket del pedido -->
  <div id="orderDetailsForImage" class="ticket" style="display:none; position: absolute; left: -9999px;">
    <div class="ticket-header">
      <h1>Pedido</h1>
      <h2>ID Pedido: <span id="imgOrderId" class="order-id"></span></h2>
    </div>
    <div class="ticket-body">
      <p><strong>Proveedor:</strong> <span id="imgProviderName"></span></p>
      <p><strong>Sucursal:</strong> <span id="imgSucursalName"></span></p>
      <p><strong>Fecha de Pedido:</strong> <span id="imgOrderDate"></span></p>
      <h3>Productos:</h3>
      <table class="products-table">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Presentación</th>
            <th>Cantidad</th>
            <th>Stock</th>
          </tr>
        </thead>
        <tbody id="imgProductsTableBody"></tbody>
      </table>
    </div>
    <div class="ticket-footer">
      <p>Gracias por su pedido.</p>
    </div>
  </div>

</body>
</html>
