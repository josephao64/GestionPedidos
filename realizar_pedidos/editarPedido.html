<!-- editarPedido.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Pedido Pre-guardado</title>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
  
  <!-- html2canvas y jsPDF para exportar -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Estilos -->
  <link rel="stylesheet" href="styles.css" />
  
  <!-- Lógica de edición de pedidos -->
  <script defer src="editarPedidoApp.js"></script>
</head>
<body>

  <h1 style="text-align: center;">Editar Pedido Pre-guardado</h1>

  <!-- Botón para regresar al menú principal -->
  <div style="text-align: center; margin-bottom: 20px;">
    <button onclick="window.location.href='pedidosPguardados.html'">Regresar al Menú Principal</button>
  </div>

  <!-- Contenedor del formulario de edición -->
  <div class="container">
    <div class="order-form">
      <div class="form-group">
        <label for="editOrderProviderSelect">Seleccione Proveedor:</label>
        <select id="editOrderProviderSelect" onchange="loadProductsFromProvider()"></select>
      </div>
      <div class="form-group">
        <label for="editOrderSucursalSelect">Seleccione Sucursal:</label>
        <select id="editOrderSucursalSelect"></select>
      </div>
      <div class="form-group">
        <label for="editOrderDate">Fecha de Pedido:</label>
        <input type="date" id="editOrderDate">
      </div>
      <div class="form-group">
        <label for="editOrderId">ID Pedido:</label>
        <input type="text" id="editOrderId" placeholder="ID Pedido" readonly>
      </div>
    </div>

    <!-- Sección para añadir productos al pedido -->
    <div class="product-form-and-table">
      <div class="product-form-container">
        <div class="product-form-group">
          <button onclick="showProductSelectionModal()">Seleccionar Producto</button>
        </div>
        <div class="product-form-group">
          <label for="productNameSelected">Producto:</label>
          <input type="text" id="productNameSelected" placeholder="Producto" readonly>
        </div>
        <div class="product-form-group">
          <label for="productPresentationSelected">Presentación:</label>
          <input type="text" id="productPresentationSelected" placeholder="Presentación" readonly>
        </div>
        <div class="product-form-group">
          <label for="productQuantity">Cantidad Pedido:</label>
          <input type="number" id="productQuantity" placeholder="Cantidad Pedido">
        </div>
        <div class="product-form-group">
          <label for="productStock">Stock Actual:</label>
          <input type="number" id="productStock" placeholder="Stock Actual">
          <label>
            <input type="checkbox" id="stockNA"> N/A
          </label>
        </div>
        <div class="product-form-group">
          <button type="button" onclick="addProductToOrder()">Agregar Producto</button>
        </div>
      </div>

      <div class="table-wrapper">
        <table id="editOrderTable">
          <thead>
            <tr>
              <th>Producto</th>
              <th>Presentación</th>
              <th>Cantidad Pedido</th>
              <th>Stock</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <!-- Filas generadas dinámicamente -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Botón para guardar los cambios del pedido -->
    <div style="text-align: center; margin-top: 20px;">
      <button class="save-order-button" onclick="handleSaveChanges()">Guardar Cambios</button>
    </div>
  </div>

  <!-- Modal para la selección de productos -->
  <div id="productSelectionModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeProductSelectionModal()">&times;</span>
      <h2 style="text-align: center;">Seleccionar Productos</h2>
      <table id="productSelectionTable">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Presentación</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody>
          <!-- Filas generadas dinámicamente -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Ticket Oculto para Generar Imagen -->
  <div id="ticketContainer" style="display: none;">
    <div class="ticket">
      <h2>Recibo de Pedido</h2>
      <p><strong>ID de Pedido:</strong> <span id="ticketOrderId"></span></p>
      <p><strong>Fecha:</strong> <span id="ticketOrderDate"></span></p>
      <p><strong>Sucursal:</strong> <span id="ticketSucursalName"></span></p>
      <p><strong>Proveedor:</strong> <span id="ticketProviderName"></span></p>
      <table>
          <thead>
              <tr>
                  <th>Producto</th>
                  <th>Presentación</th>
                  <th>Cantidad</th>
                  <th>Stock</th>
              </tr>
          </thead>
          <tbody id="ticketProductsTableBody">
              <!-- Productos se insertarán aquí -->
          </tbody>
      </table>
      <p class="thank-you">¡Gracias por su pedido!</p>
    </div>
  </div>

</body>
</html>
