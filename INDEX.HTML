<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página Principal</title>

  <!-- Políticas de seguridad para reducir avisos de "sitio peligroso" -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.googleapis.com https://cdnjs.cloudflare.com; connect-src 'self' https://firestore.googleapis.com https://www.googleapis.com https://securetoken.googleapis.com https://www.gstatic.com https://identitytoolkit.googleapis.com; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Permissions-Policy" content="geolocation=(), camera=(), microphone=()">

  <!-- Estilos CSS Integrados -->
  <style>
    /* =====================================
       Estilos Generales
       ===================================== */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
      position: relative;
      min-height: 100vh;
    }
    /* =====================================
       Contenedor para el mensaje de bienvenida
       ===================================== */
    .welcome-container {
      position: fixed;
      top: 20px;
      right: 20px;
      font-size: 18px;
      color: #333;
      background-color: rgba(255, 255, 255, 0.8);
      padding: 10px 20px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      z-index: 1000;
    }
    /* =====================================
       Contenedor para el logo centrado en la parte superior
       ===================================== */
    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 0;
    }
    .logo-container img {
      max-width: 200px;
      width: 100%;
      height: auto;
    }
    /* =====================================
       Mensaje central "MENU PRINCIPAL"
       ===================================== */
    .menu-principal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 36px;
      font-weight: bold;
      color: #333;
      text-align: center;
      z-index: 500;
    }
    /* =====================================
       Contenedor de Navegación
       ===================================== */
    .navigation {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      padding-left: 20px;
      position: relative;
    }
    /* =====================================
       Menú de Opciones (oe_menu)
       ===================================== */
    .oe_menu {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      position: fixed;
      top: 50%;
      left: 20px;
      transform: translateY(-50%);
      z-index: 600;
    }
    .oe_menu li {
      margin: 10px 0;
    }
    .oe_menu a, .menu-button {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 150px;
      height: 150px;
      font-size: 18px;
      text-align: center;
      text-decoration: none;
      color: white;
      background-color: #007BFF;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .oe_menu a:hover, .menu-button:hover {
      background-color: #0056b3;
    }
    /* =====================================
       Contenedor del Menú Derecho (right-menu)
       ===================================== */
    .right-menu {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 600;
    }
    /* Botón exclusivo para administradores: Empresa, Bodega y Reportes */
    .menu-button.admin-only {
      display: none;
    }
    /* Estilos específicos para el botón de Cerrar Sesión */
    .menu-button#logout-button {
      background-color: #f44336;
    }
    .menu-button#logout-button:hover {
      background-color: #da190b;
    }
    /* =====================================
       Elementos exclusivos para administradores
       (se mostrarán mediante JavaScript si el rol es 'administrador')
       ===================================== */
    .admin-only {
      display: none;
    }
    /* =====================================
       Responsividad para dispositivos móviles
       ===================================== */
    @media (max-width: 768px) {
      .welcome-container {
        top: 10px;
        right: 10px;
        font-size: 16px;
        padding: 8px 16px;
      }
      .logo-container {
        padding: 15px 0;
      }
      .logo-container img {
        max-width: 150px;
      }
      .menu-principal {
        font-size: 28px;
      }
      .oe_menu {
        top: 55%;
        left: 10px;
        transform: translateY(-55%);
      }
      .oe_menu a, .menu-button {
        width: 120px;
        height: 120px;
        font-size: 16px;
      }
      .right-menu {
        bottom: 10px;
        right: 10px;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <!-- Contenedor para el mensaje de bienvenida -->
  <div class="welcome-container" id="welcome-message">Bienvenido, Usuario</div>

  <!-- Contenedor para el logo centrado -->
  <div class="logo-container">
    <!-- El logo se encuentra en: resources/images/logo.png -->
    <img src="resources/images/logo.png" alt="Logo de la aplicación">
  </div>

  <!-- Mensaje central "MENU PRINCIPAL" -->
  <div class="menu-principal">MENU PRINCIPAL</div>

  <!-- Contenedor de navegación -->
  <div class="navigation">
    <ul class="oe_menu">
      <li><a href="realizarPedido/realizadPedido.html">Realizar pedidos</a></li>
      <li><a href="gestionPedidos/pedidos.html">Gestión de Pedidos</a></li>
    </ul>
    <div class="right-menu">
      <!-- Botón "Empresa" (exclusivo para administradores) -->
      <button class="menu-button admin-only" id="empresa-button">Empresa</button>
      <!-- Botón "Bodega" (exclusivo para administradores) -->
      <button class="menu-button admin-only" id="bodega-button">Bodega</button>
      <!-- Botón "Reportes" (exclusivo para administradores) -->
      <button class="menu-button admin-only" id="reportes-button">Reportes</button>
      <button class="menu-button" id="logout-button">Cerrar Sesión</button>
    </div>
  </div>

  <!-- Contenedor oculto para exportar el diseño de factura -->
  <div id="exportInvoiceContainer" style="display:none; padding:20px; border:1px solid #ccc; max-width:600px; margin:20px auto; font-family: Arial, sans-serif;">
    <h2 style="text-align:center; margin-bottom:20px;">Factura</h2>
    <div style="margin-bottom:10px;">
      <strong>Número:</strong> <span id="exportInvoiceNum"></span>
    </div>
    <div style="margin-bottom:10px;">
      <strong>Fecha:</strong> <span id="exportInvoiceDate"></span>
    </div>
    <div style="margin-bottom:10px;">
      <strong>Proveedor:</strong> <span id="exportInvoiceSupplier"></span>
    </div>
    <div style="margin-bottom:10px;">
      <strong>Producto:</strong> <span id="exportInvoiceProduct"></span>
    </div>
    <div style="margin-bottom:10px;">
      <strong>Cantidad:</strong> <span id="exportInvoiceQuantity"></span>
    </div>
    <div style="margin-bottom:10px;">
      <strong>Precio Unitario:</strong> Q.<span id="exportInvoiceUnitPrice"></span>
    </div>
    <div style="margin-bottom:10px;">
      <strong>Total:</strong> Q.<span id="exportInvoiceTotal"></span>
    </div>
    <div style="text-align:center; margin-top:20px;">
      <em>Gracias por su compra</em>
    </div>
  </div>

  <!-- Firebase SDK y conexión a base de datos -->
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="database/connection.js"></script>

  <script>
    // Utilidad de navegación segura
    function navegarA(url) {
      window.location.href = url;
    }

    // Referencias a elementos del DOM
    const welcomeMessage = document.getElementById('welcome-message');
    const empresaButton  = document.getElementById('empresa-button');
    const bodegaButton   = document.getElementById('bodega-button');
    const reportesButton = document.getElementById('reportes-button');
    const logoutButton   = document.getElementById('logout-button');

    // Función para ajustar el menú según el rol del usuario
    function ajustarMenuSegunRol(rol) {
      if (rol === 'administrador') {
        // Mostrar elementos exclusivos
        document.querySelectorAll('.admin-only').forEach(el => {
          el.style.display = 'inline-block';
        });
        // Rutas por defecto para administrador
        if (empresaButton) {
          empresaButton.textContent = 'Empresa';
          empresaButton.onclick = () => navegarA('empresa/empresaMenu.html');
        }
        if (bodegaButton) {
          bodegaButton.textContent = 'Bodega';
          bodegaButton.onclick = () => navegarA('InventarioBodega/inventory.html');
        }
        if (reportesButton) {
          reportesButton.textContent = 'Reportes';
          reportesButton.onclick = () => navegarA('reportes/reportes.html');
        }
      } else if (rol === 'bodega') {
        // 1) Ocultar menú izquierdo
        const oeMenu = document.querySelector('.oe_menu');
        if (oeMenu) oeMenu.style.display = 'none';

        // 2) Ocultar elementos admin-only
        document.querySelectorAll('.admin-only').forEach(el => {
          el.style.display = 'none';
        });

        // 3) Mostrar/crear botón de Inventario Bodega accesible
        if (bodegaButton) {
          bodegaButton.classList.remove('admin-only');
          bodegaButton.style.display = 'inline-block';
          bodegaButton.textContent = 'Inventario Bodega';
          // Ruta con espacios: usar encodeURI
          bodegaButton.onclick = () => navegarA(encodeURI('InventarioBodega/salidas encargado bodega/salidas.html'));
        } else {
          const rightMenu = document.querySelector('.right-menu');
          if (rightMenu) {
            const newButton = document.createElement('button');
            newButton.className = 'menu-button';
            newButton.id = 'bodega-button';
            newButton.textContent = 'Inventario Bodega';
            newButton.onclick = () => navegarA(encodeURI('InventarioBodega/salidas encargado bodega/salidas.html'));
            rightMenu.appendChild(newButton);
          }
        }
      }
    }

    // Función para verificar el usuario logueado y su rol
    function verificarUsuario() {
      try {
        const usuarioLogueado = localStorage.getItem('usuarioLogueado');
        if (!usuarioLogueado) {
          navegarA('login.html');
          return;
        }
        // Consulta a Firestore para obtener el rol
        db.collection('usuarios')
          .where('username', '==', usuarioLogueado)
          .limit(1)
          .get()
          .then(querySnapshot => {
            if (querySnapshot.empty) {
              alert('Usuario no encontrado. Por favor, inicia sesión nuevamente.');
              navegarA('login.html');
              return;
            }
            const userData = querySnapshot.docs[0].data();
            ajustarMenuSegunRol(userData.rol);
            welcomeMessage.textContent = `Bienvenido, ${userData.username}!`;
          })
          .catch(error => {
            console.error('Error al verificar el usuario: ', error);
            alert('Error al verificar el usuario. Por favor, intenta nuevamente.');
            navegarA('login.html');
          });
      } catch (e) {
        console.error('Error general en verificación: ', e);
        navegarA('login.html');
      }
    }

    // Función para manejar el cierre de sesión
    function cerrarSesion() {
      try {
        localStorage.removeItem('usuarioLogueado');
      } finally {
        navegarA('login.html');
      }
    }

    // Listeners
    if (logoutButton) logoutButton.addEventListener('click', cerrarSesion);

    // Inicio
    window.onload = verificarUsuario;
  </script>
</body>
</html>
