<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página Principal</title>
  <style>
    /* =====================================
       Estilos Generales
       ===================================== */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    /* =====================================
       Bienvenida
       ===================================== */
    .welcome-container {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.8);
      padding: 10px 20px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      font-size: 18px;
      color: #333;
      z-index: 1000;
    }
    /* =====================================
       Logo
       ===================================== */
    .logo-container {
      display: flex;
      justify-content: center;
      padding: 20px 0;
    }
    .logo-container img {
      max-width: 200px;
      width: 100%;
      height: auto;
    }
    /* =====================================
       Título central
       ===================================== */
    .menu-principal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 36px;
      font-weight: bold;
      color: #333;
      text-align: center;
      z-index: 500;
    }
    /* =====================================
       Menú Izquierdo
       ===================================== */
    .navigation {
      position: fixed;
      top: 50%;
      left: 20px;
      transform: translateY(-50%);
      z-index: 600;
    }
    .oe_menu {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .oe_menu li {
      margin: 10px 0;
      display: none;
    }
    .oe_menu li.default-item {
      display: block;
    }
    .oe_menu li.bodega-only {
      display: none;
    }
    .oe_menu a {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 150px;
      height: 150px;
      background-color: #007BFF;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-size: 18px;
      transition: background-color 0.3s ease;
    }
    .oe_menu a:hover {
      background-color: #0056b3;
    }
    /* =====================================
       Menú Derecho
       ===================================== */
    .right-menu {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 600;
    }
    .menu-button {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 150px;
      height: 150px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .menu-button:hover {
      background-color: #0056b3;
    }
    .admin-only,
    .bodega-only {
      display: none;
    }
    #logout-button {
      background-color: #f44336;
    }
    #logout-button:hover {
      background-color: #da190b;
    }
    /* =====================================
       Responsividad
       ===================================== */
    @media (max-width: 768px) {
      .welcome-container { top:10px; right:10px; font-size:16px; padding:8px 16px; }
      .logo-container img { max-width:150px; }
      .menu-principal { font-size:28px; }
      .navigation { left:10px; transform:translateY(-55%); }
      .oe_menu a, .menu-button { width:120px; height:120px; font-size:16px; }
      .right-menu { bottom:10px; right:10px; gap:8px; }
    }
  </style>
</head>
<body>
  <div class="welcome-container" id="welcome-message">Bienvenido, Usuario</div>

  <div class="logo-container">
    <img src="resources/images/logo.png" alt="Logo de la aplicación">
  </div>

  <div class="menu-principal">MENU PRINCIPAL</div>

  <div class="navigation">
    <ul class="oe_menu">
      <li class="default-item">
        <a href="realizarPedido/realizadPedido.html">Realizar pedidos</a>
      </li>
      <li class="default-item">
        <a href="gestionPedidos/pedidos.html">Gestión de Pedidos</a>
      </li>
      <li class="bodega-only">
        <a href="bodega/gestionPedidos/pedidos.html">Gestión Pedidos Bodega</a>
      </li>
    </ul>
  </div>

  <div class="right-menu">
    <button class="menu-button admin-only" id="empresa-button">
      Empresa
    </button>
    <button class="menu-button admin-only" id="bodega-button">
      Bodega
    </button>
    <button class="menu-button admin-only" id="reportes-button">
      Reportes
    </button>
    <!-- Inventario Bodega: siempre visible para bodega -->
    <button class="menu-button bodega-only" id="bodega-inventory-button">
      Inventario Bodega
    </button>
    <button class="menu-button" id="logout-button">Cerrar Sesión</button>
  </div>

  <!-- (Resto de contenido y modales sin cambios) -->

  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
  <script src="database/connection.js"></script>
  <script>
    const welcomeMessage           = document.getElementById('welcome-message');
    const logoutButton             = document.getElementById('logout-button');
    const empresaButton            = document.getElementById('empresa-button');
    const reportesButton           = document.getElementById('reportes-button');
    const bodegaInventoryButton    = document.getElementById('bodega-inventory-button');

    function ajustarMenuSegunRol(rol, username) {
      welcomeMessage.textContent = `Bienvenido, ${username}!`;

      // siempre mostrar los items "default"
      document.querySelectorAll('.oe_menu li.default-item')
        .forEach(li => li.style.display = 'block');

      if (rol === 'administrador') {
        document.querySelectorAll('.admin-only')
          .forEach(el => el.style.display = 'flex');
      }

      if (rol === 'bodega') {
        // ocultar los default
        document.querySelectorAll('.oe_menu li.default-item')
          .forEach(li => li.style.display = 'none');
        // mostrar el menú izquierdo de bodega
        document.querySelector('.oe_menu li.bodega-only')
          .style.display = 'block';
        // mostrar el botón de Inventario Bodega
        bodegaInventoryButton.style.display = 'flex';
        bodegaInventoryButton.onclick = () => {
          window.location.href = 'InventarioBodega/salidas encargado bodega/salidas.html';
        };
      }
    }

    function verificarUsuario() {
      const usuario = localStorage.getItem('usuarioLogueado');
      if (!usuario) {
        window.location.href = 'login.html';
        return;
      }
      db.collection('usuarios')
        .where('username','==',usuario)
        .limit(1)
        .get()
        .then(snap => {
          if (snap.empty) throw new Error();
          const data = snap.docs[0].data();
          ajustarMenuSegunRol(data.rol, data.username);
        })
        .catch(() => {
          alert('Error de autenticación, inicia sesión de nuevo.');
          window.location.href = 'login.html';
        });
    }

    function cerrarSesion() {
      localStorage.removeItem('usuarioLogueado');
      window.location.href = 'login.html';
    }

    logoutButton.addEventListener('click', cerrarSesion);
    empresaButton.addEventListener('click', () => {
      window.location.href = 'empresa/empresaMenu.html';
    });
    reportesButton.addEventListener('click', () => {
      window.location.href = 'reportes/reportes.html';
    });

    window.onload = verificarUsuario;
  </script>
</body>
</html>
