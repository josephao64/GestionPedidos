<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página Principal</title>
  <!-- Estilos CSS Integrados -->
  <style>
    /* =====================================
       Estilos Generales
       ===================================== */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
      position: relative;
      min-height: 100vh;
    }
    /* =====================================
       Contenedor para el mensaje de bienvenida
       ===================================== */
    .welcome-container {
      position: fixed;
      top: 20px;
      right: 20px;
      font-size: 18px;
      color: #333;
      background-color: rgba(255, 255, 255, 0.8);
      padding: 10px 20px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      z-index: 1000;
    }
    /* =====================================
       Contenedor para el logo centrado en la parte superior
       ===================================== */
    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 0;
    }
    .logo-container img {
      max-width: 200px;
      width: 100%;
      height: auto;
    }
    /* =====================================
       Mensaje central "MENU PRINCIPAL"
       ===================================== */
    .menu-principal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 36px;
      font-weight: bold;
      color: #333;
      text-align: center;
      z-index: 500;
    }
    /* =====================================
       Contenedor de Navegación
       ===================================== */
    .navigation {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      padding-left: 20px;
      position: relative;
    }
    /* =====================================
       Menú de Opciones (oe_menu)
       ===================================== */
    .oe_menu {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      position: fixed;
      top: 50%;
      left: 20px;
      transform: translateY(-50%);
      z-index: 600;
    }
    .oe_menu li {
      margin: 10px 0;
    }
    .oe_menu a, .menu-button {
      display: flex;
      justify-content: center;
      align-items: center;
      width: clamp(110px, 22vw, 150px);
      height: clamp(110px, 22vw, 150px);
      font-size: clamp(14px, 2.2vw, 18px);
      text-align: center;
      text-decoration: none;
      color: white;
      background-color: #007BFF;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .oe_menu a:hover, .menu-button:hover {
      background-color: #0056b3;
    }
    /* =====================================
       Contenedor del Menú Derecho (right-menu)
       ===================================== */
    .right-menu {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 600;
    }
    /* Botón exclusivo para administradores: Empresa, Bodega y Reportes */
    .menu-button.admin-only {
      display: none;
    }
    /* Estilos específicos para el botón de Cerrar Sesión */
    .menu-button#logout-button {
      background-color: #f44336;
    }
    .menu-button#logout-button:hover {
      background-color: #da190b;
    }
    /* =====================================
       Elementos exclusivos para administradores
       (se mostrarán mediante JavaScript si el rol es 'administrador')
       ===================================== */
    .admin-only {
      display: none;
    }
    
    /* Ocultar enlaces específicos para usuarios view */
    .view-user .realizar-pedido {
      display: none;
    }
    /* =====================================
       Responsividad para dispositivos móviles
       ===================================== */
    @media (max-width: 992px) {
      .welcome-container {
        top: 10px;
        right: 10px;
        font-size: 16px;
        padding: 8px 16px;
      }
      .logo-container {
        padding: 15px 0;
      }
      .logo-container img {
        max-width: 150px;
      }
      .menu-principal {
        font-size: 28px;
      }
      /* Reorganizar menú izquierdo para que no se salga de la pantalla */
      .oe_menu {
        position: static;
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin: 10px;
        transform: none;
      }
      .oe_menu li { margin: 0; }
      /* Menú derecho como barra inferior flexible */
      .right-menu {
        position: static;
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin: 10px;
      }
    }

    /* Ajustes extra para pantallas muy pequeñas */
    @media (max-width: 576px) {
      .menu-principal { font-size: 24px; }
      .logo-container img { max-width: 120px; }
    }
  </style>
</head>
<body>
  <!-- Contenedor para el mensaje de bienvenida -->
  <div class="welcome-container" id="welcome-message">Bienvenido, Usuario</div>

  <!-- Contenedor para el logo centrado -->
  <div class="logo-container">
    <!-- El logo se encuentra en: resources/images/logo.png -->
    <img src="resources/images/logo.png" alt="Logo de la aplicación">
  </div>

  <!-- Mensaje central "MENU PRINCIPAL" -->
  <div class="menu-principal">MENU PRINCIPAL</div>

  <!-- Contenedor de navegación -->
  <div class="navigation">
    <ul class="oe_menu">
      <li><a href="realizarPedido/realizadPedido.html">Realizar pedidos</a></li>
      <li><a href="gestionPedidos/pedidos.html">Gestión de Pedidos</a></li>
      <li class="admin-only"><a href="tickets/tickets.html">Tickets</a></li>
      <li class="admin-only"><a href="tickets/adminDashboard.html">Dashboard Tickets</a></li>
    </ul>
    <div class="right-menu">
      <!-- Botón "Empresa" (exclusivo para administradores) -->
      <button class="menu-button admin-only" id="empresa-button" onclick="window.location.href='empresa/empresaMenu.html'">Empresa</button>
      <!-- Botón "Bodega" (exclusivo para administradores) -->
      <button class="menu-button admin-only" id="bodega-button" onclick="window.location.href='InventarioBodega/inventory.html'">Bodega</button>
      <!-- Botón "Reportes" (exclusivo para administradores) -->
      <button class="menu-button admin-only" id="reportes-button" onclick="window.location.href='reportes/reportes.html'">Reportes</button>
      <!-- Botón "Cuentas por Pagar" (exclusivo para administradores) -->
      <button class="menu-button admin-only" id="cuentas-pagar-button" onclick="window.location.href='CuentasPorPagar/cuentasPorPagar.html'">Cuentas por Pagar</button>
      <button class="menu-button" id="logout-button">Cerrar Sesión</button>
    </div>
  </div>

  <!-- Resto de tu contenido y modales (para productos, movimientos, facturas, etc.) se mantiene igual -->
  <!-- … (código completo de modales y demás se deja sin cambios) … -->

  <!-- Contenedor oculto para exportar el diseño de factura -->
  <div id="exportInvoiceContainer" style="display:none; padding:20px; border:1px solid #ccc; max-width:600px; margin:20px auto; font-family: Arial, sans-serif;">
    <h2 style="text-align:center; margin-bottom:20px;">Factura</h2>
    <div style="margin-bottom:10px;">
      <strong>Número:</strong> <span id="exportInvoiceNum"></span>
    </div>
    <div style="margin-bottom:10px;">
      <strong>Fecha:</strong> <span id="exportInvoiceDate"></span>
    </div>
    <div style="margin-bottom:10px;">
      <strong>Proveedor:</strong> <span id="exportInvoiceSupplier"></span>
    </div>
    <div style="margin-bottom:10px;">
      <strong>Producto:</strong> <span id="exportInvoiceProduct"></span>
    </div>
    <div style="margin-bottom:10px;">
      <strong>Cantidad:</strong> <span id="exportInvoiceQuantity"></span>
    </div>
    <div style="margin-bottom:10px;">
      <strong>Precio Unitario:</strong> Q.<span id="exportInvoiceUnitPrice"></span>
    </div>
    <div style="margin-bottom:10px;">
      <strong>Total:</strong> Q.<span id="exportInvoiceTotal"></span>
    </div>
    <div style="text-align:center; margin-top:20px;">
      <em>Gracias por su compra</em>
    </div>
  </div>

  <!-- Se omiten aquí los modales de productos, movimientos, reajustes, catálogo, facturas y reportes (mantén el código existente) -->
  <!-- … (código completo de modales se mantiene sin cambios) … -->

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Firebase SDK y conexión a base de datos -->
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <!-- Configuración de seguridad -->
  <script src="security-config.js"></script>
  <script src="database/connection.js"></script>
  <script>
    // Referencias a elementos del DOM
    const welcomeMessage = document.getElementById('welcome-message');
    const empresaButton = document.getElementById('empresa-button');
    const logoutButton = document.getElementById('logout-button');

    // Función para ajustar el menú según el rol del usuario
    function ajustarMenuSegunRol(rol) {
      if (rol === 'administrador') {
        // Para administradores, mostramos los elementos exclusivos
        const adminElements = document.querySelectorAll('.admin-only');
        adminElements.forEach(element => {
          element.style.display = 'inline-block';
        });
        // Iniciar notificaciones de nuevos tickets para administradores
        try { iniciarNotificacionesTicketsAdmin(); } catch (e) { console.warn('Notif tickets admin:', e); }
      } else if (rol === 'view') {
        // For view-only users, show only order management
        const oeMenu = document.querySelector('.oe_menu');
        if (oeMenu) {
          // Remover el enlace de "Realizar pedidos" para usuarios view
          const realizarPedidoLink = oeMenu.querySelector('a[href*="realizarPedido"]');
          if (realizarPedidoLink) {
            realizarPedidoLink.parentElement.remove();
          }
          oeMenu.style.display = 'block';
        }
        // Hide admin buttons
        const adminElements = document.querySelectorAll('.admin-only');
        adminElements.forEach(element => {
          element.style.display = 'none';
        });
      } else if (rol === 'bodega') {
        // Para usuarios con rol "bodega":
        // 1. Ocultar el menú izquierdo (clase .oe_menu)
        const oeMenu = document.querySelector('.oe_menu');
        if (oeMenu) {
          oeMenu.style.display = 'none';
        }
        // 2. Ocultar botones exclusivos de administradores (se mantiene el botón de cerrar sesión)
        const adminElements = document.querySelectorAll('.admin-only');
        adminElements.forEach(element => {
          element.style.display = 'none';
        });
        // 3. Mostrar o actualizar el botón de "Bodega" para inventario
        const bodegaButton = document.getElementById('bodega-button');
        if (bodegaButton) {
          // Eliminar la clase 'admin-only' para evitar conflictos con el CSS
          bodegaButton.classList.remove('admin-only');
          bodegaButton.style.display = 'inline-block';
          bodegaButton.textContent = 'Inventario Bodega';
          bodegaButton.onclick = function() {
            window.location.href = 'InventarioBodega/salidas encargado bodega/salidas.html';
          };
        } else {
          // Si el botón no existe, se crea y se agrega al contenedor derecho
          const rightMenu = document.querySelector('.right-menu');
          if (rightMenu) {
            const newButton = document.createElement('button');
            newButton.className = 'menu-button';
            newButton.id = 'bodega-button';
            newButton.textContent = 'Inventario Bodega';
            newButton.onclick = function() {
              window.location.href = 'InventarioBodega/salidas encargado bodega/salidas.html';
            };
            rightMenu.appendChild(newButton);
          }
        }
      }
    }

    // Función para verificar el usuario logueado y su rol
    function verificarUsuario() {
      const usuarioLogueado = localStorage.getItem('usuarioLogueado');
      if (usuarioLogueado) {
        db.collection('usuarios').where('username', '==', usuarioLogueado).limit(1).get()
          .then(querySnapshot => {
            if (!querySnapshot.empty) {
              const userData = querySnapshot.docs[0].data();
              ajustarMenuSegunRol(userData.rol);
              welcomeMessage.textContent = `Bienvenido, ${userData.username}! (${userData.rol})`;
            } else {
              alert('Usuario no encontrado. Por favor, inicia sesión nuevamente.');
              window.location.href = 'login.html';
            }
          })
          .catch(error => {
            console.error("Error al verificar el usuario: ", error);
            alert('Error al verificar el usuario. Por favor, intenta nuevamente.');
            window.location.href = 'login.html';
          });
      } else {
        window.location.href = 'login.html';
      }
    }

    // =============================
    //  Notificaciones de nuevos tickets (solo admin)
    // =============================
    let ticketsNotifUnsub = null;
    let ticketsNotifStartTime = null;
    const ticketsNotificados = new Set();
    const notifIcon = 'resources/images/logo.png';
    
    function solicitarPermisoNotificaciones() {
      if (!('Notification' in window)) {
        Swal.fire({
          icon: 'warning',
          title: 'Notificaciones no disponibles',
          text: 'Tu navegador no soporta notificaciones del sistema.',
          timer: 3000
        });
        return Promise.resolve('unsupported');
      }
      
      // Si ya está concedido, continuar
      if (Notification.permission === 'granted') {
        console.log('Permiso de notificaciones ya concedido');
        // Mostrar mensaje breve confirmando que las notificaciones están activas
        Swal.fire({
          icon: 'success',
          title: 'Notificaciones activas',
          text: 'Las notificaciones del sistema están activas para nuevos tickets.',
          timer: 2000,
          showConfirmButton: false
        });
        return Promise.resolve('granted');
      }
      
      // Si está denegado, mostrar instrucciones para habilitarlo
      if (Notification.permission === 'denied') {
        return Swal.fire({
          icon: 'warning',
          title: 'Notificaciones bloqueadas',
          html: `
            <p>Las notificaciones del sistema están bloqueadas para este sitio.</p>
            <p><strong>Para habilitarlas:</strong></p>
            <ol style="text-align: left; display: inline-block;">
              <li>Haz clic en el ícono de candado en la barra de direcciones</li>
              <li>Busca "Notificaciones"</li>
              <li>Cambia a "Permitir"</li>
              <li>Recarga la página</li>
            </ol>
          `,
          confirmButtonText: 'Entendido',
          confirmButtonColor: '#007BFF'
        }).then(() => Promise.resolve('denied'));
      }
      
      // Si es 'default', solicitar permiso con mensaje explicativo
      return Swal.fire({
        title: 'Activar Notificaciones del Sistema',
        html: `
          <p>Para recibir notificaciones cuando se creen nuevos tickets, necesitamos tu permiso.</p>
          <p><strong>Las notificaciones aparecerán en Windows aunque no tengas la página abierta.</strong></p>
        `,
        icon: 'info',
        showCancelButton: true,
        confirmButtonText: 'Sí, permitir notificaciones',
        cancelButtonText: 'No, gracias',
        confirmButtonColor: '#007BFF',
        cancelButtonColor: '#6c757d'
      }).then((result) => {
        if (result.isConfirmed) {
          // Solicitar permiso del navegador
          return Notification.requestPermission().then(perm => {
            if (perm === 'granted') {
              Swal.fire({
                icon: 'success',
                title: '¡Notificaciones activadas!',
                text: 'Recibirás notificaciones del sistema cuando se creen nuevos tickets.',
                timer: 3000,
                showConfirmButton: false
              });
              console.log('Permiso de notificaciones concedido');
            } else if (perm === 'denied') {
              Swal.fire({
                icon: 'info',
                title: 'Permiso denegado',
                html: `
                  <p>No recibirás notificaciones.</p>
                  <p>Puedes cambiar esto en la configuración del navegador más tarde.</p>
                `,
                timer: 3000
              });
            } else {
              Swal.fire({
                icon: 'info',
                title: 'Permiso pendiente',
                text: 'No se pudo determinar el permiso. Verifica la configuración del navegador.',
                timer: 3000
              });
            }
            return perm;
          }).catch(err => {
            console.error('Error al solicitar permiso:', err);
            Swal.fire({
              icon: 'error',
              title: 'Error',
              text: 'Error al solicitar permisos: ' + err.message
            });
            return 'denied';
          });
        } else {
          // Usuario canceló
          Swal.fire({
            icon: 'info',
            title: 'Notificaciones desactivadas',
            text: 'No recibirás notificaciones. Puedes activarlas más tarde desde la configuración.',
            timer: 2000
          });
          return Promise.resolve('denied');
        }
      });
    }
    
    function mostrarNotifTicket(docData) {
      if (!('Notification' in window) || Notification.permission !== 'granted') {
        console.warn('No se puede mostrar notificación: permiso no concedido');
        return;
      }
      const title = `Nuevo Ticket: ${docData.ticketId || 'Ticket'}`;
      const body = `${docData.sucursalName ? docData.sucursalName + ' · ' : ''}${docData.area || ''}${docData.subCategory ? ' - ' + docData.subCategory : ''}`.trim() || 'Sin descripción';
      const priority = docData.priority === 'urgent' ? '🔴 Urgente' : docData.priority === 'normal' ? '🟡 Normal' : '🔵 Baja';
      
      try {
        const notification = new Notification(title, {
          body: `${body}\nPrioridad: ${priority}`,
          icon: notifIcon,
          badge: notifIcon,
          tag: docData.ticketId || 'ticket',
          requireInteraction: docData.priority === 'urgent',
          silent: false
        });
        
        notification.onclick = function() {
          window.focus();
          notification.close();
        };
        
        console.log('Notificación mostrada:', title);
      } catch (e) {
        console.error('Error al mostrar notificación:', e);
      }
    }
    
    function iniciarNotificacionesTicketsAdmin() {
      if (ticketsNotifUnsub) {
        console.log('Listener de tickets ya iniciado');
        return; // ya iniciado
      }
      
      console.log('Iniciando notificaciones de tickets para admin...');
      
      // Pequeño delay para asegurar que la página esté completamente cargada
      // Esto ayuda a que algunos navegadores acepten mejor la solicitud de permisos
      setTimeout(() => {
        solicitarPermisoNotificaciones().then((perm) => {
          if (perm !== 'granted') {
            console.warn('Permiso de notificaciones no concedido:', perm);
            if (perm === 'default') {
              // Si el usuario aún no ha decidido, mostrar un mensaje adicional
              console.log('Permiso aún pendiente, el usuario puede activarlo más tarde');
            }
            return;
          }
          
          // Mostrar confirmación si el permiso ya estaba concedido
          if (Notification.permission === 'granted' && ticketsNotifUnsub === null) {
            console.log('Permiso de notificaciones activo, iniciando listener...');
          }
          
          // Marcar el tiempo de inicio (solo notificar tickets creados después de este momento)
          ticketsNotifStartTime = Date.now() - 5000; // 5 segundos de margen
          
          try {
            // Usar listener sin orderBy para evitar problemas de índice
            // Escuchamos todos los cambios y filtramos por timestamp
            ticketsNotifUnsub = db.collection('tickets')
              .onSnapshot((snap) => {
                console.log('Cambios detectados en tickets:', snap.docChanges().length);
                
                snap.docChanges().forEach((chg) => {
                  // Solo procesar documentos nuevos (added)
                  if (chg.type !== 'added') {
                    return;
                  }
                  
                  const doc = chg.doc;
                  const data = doc.data() || {};
                  
                  // Evitar duplicados
                  if (ticketsNotificados.has(doc.id)) {
                    return;
                  }
                  
                  // Obtener timestamp del ticket
                  let ticketTime = null;
                  if (data.createdAt && data.createdAt.toDate) {
                    ticketTime = data.createdAt.toDate().getTime();
                  } else if (data.createdAtLocal) {
                    ticketTime = Date.parse(data.createdAtLocal);
                  } else if (data.createdAt) {
                    ticketTime = data.createdAt.getTime ? data.createdAt.getTime() : Date.now();
                  }
                  
                  // Si no hay timestamp válido, usar el tiempo actual menos 1 minuto como fallback
                  if (!ticketTime || isNaN(ticketTime)) {
                    ticketTime = Date.now() - 60000;
                  }
                  
                  // Solo notificar tickets creados después del inicio del listener (con margen de 5 segundos)
                  if (ticketTime < ticketsNotifStartTime) {
                    console.log('Ticket antiguo ignorado:', doc.id, 'Timestamp:', ticketTime, 'Inicio:', ticketsNotifStartTime);
                    ticketsNotificados.add(doc.id);
                    return;
                  }
                  
                  // Marcar como notificado y mostrar
                  ticketsNotificados.add(doc.id);
                  console.log('Nuevo ticket detectado:', doc.id, data.ticketId, 'Timestamp:', ticketTime);
                  mostrarNotifTicket(data);
                });
              }, (err) => {
                console.error('Error en listener de tickets:', err);
                Swal.fire({ icon: 'error', title: 'Error', text: 'Error al escuchar nuevos tickets: ' + err.message });
              });
              
            console.log('Listener de tickets iniciado correctamente');
          } catch (e) {
            console.error('Error al iniciar listener de tickets:', e);
            Swal.fire({ icon: 'error', title: 'Error', text: 'Error al iniciar notificaciones: ' + e.message });
          }
        }).catch((err) => {
          console.error('Error al solicitar permisos:', err);
        });
      }, 500); // Delay de 500ms para asegurar que la página esté lista
    }

    // Función para manejar el cierre de sesión
    function cerrarSesion() {
      localStorage.removeItem('usuarioLogueado');
      window.location.href = 'login.html';
    }

    logoutButton.addEventListener('click', cerrarSesion);
    empresaButton.addEventListener('click', function() {
      window.location.href = 'empresa/empresaMenu.html';
    });

    window.onload = verificarUsuario;
  </script>
</body>
</html>
