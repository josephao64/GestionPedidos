<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página Principal</title>
  <!-- Estilos CSS Integrados -->
  <style>
    /* =====================================
       Estilos Generales
       ===================================== */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
      position: relative;
      min-height: 100vh;
    }
    /* =====================================
       Contenedor para el mensaje de bienvenida
       ===================================== */
    .welcome-container {
      position: fixed;
      top: 20px;
      right: 20px;
      font-size: 18px;
      color: #333;
      background-color: rgba(255, 255, 255, 0.8);
      padding: 10px 20px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      z-index: 1000;
    }
    /* =====================================
       Contenedor para el logo centrado en la parte superior
       ===================================== */
    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 0;
    }
    .logo-container img {
      max-width: 200px;
      width: 100%;
      height: auto;
    }
    /* =====================================
       Mensaje central "MENU PRINCIPAL"
       ===================================== */
    .menu-principal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 36px;
      font-weight: bold;
      color: #333;
      text-align: center;
      z-index: 500;
    }
    /* =====================================
       Contenedor de Navegación
       ===================================== */
    .navigation {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      padding-left: 20px;
      position: relative;
    }
    /* =====================================
       Menú de Opciones (oe_menu)
       ===================================== */
    .oe_menu {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      position: fixed;
      top: 50%;
      left: 20px;
      transform: translateY(-50%);
      z-index: 600;
    }
    .oe_menu li {
      margin: 10px 0;
    }
    .oe_menu a, .menu-button {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 150px;
      height: 150px;
      font-size: 18px;
      text-align: center;
      text-decoration: none;
      color: white;
      background-color: #007BFF;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .oe_menu a:hover, .menu-button:hover {
      background-color: #0056b3;
    }
    /* =====================================
       Contenedor del Menú Derecho (right-menu)
       ===================================== */
    .right-menu {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 600;
    }
    .menu-button#logout-button {
      background-color: #f44336;
    }
    .menu-button#logout-button:hover {
      background-color: #da190b;
    }
    /* =====================================
       Responsividad para dispositivos móviles
       ===================================== */
    @media (max-width: 768px) {
      .welcome-container {
        top: 10px;
        right: 10px;
        font-size: 16px;
        padding: 8px 16px;
      }
      .logo-container {
        padding: 15px 0;
      }
      .logo-container img {
        max-width: 150px;
      }
      .menu-principal {
        font-size: 28px;
      }
      .oe_menu {
        top: 55%;
        left: 10px;
        transform: translateY(-55%);
      }
      .oe_menu a, .menu-button {
        width: 120px;
        height: 120px;
        font-size: 16px;
      }
      .right-menu {
        bottom: 10px;
        right: 10px;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <!-- Contenedor para el mensaje de bienvenida -->
  <div class="welcome-container" id="welcome-message">Bienvenido, Usuario</div>

  <!-- Contenedor para el logo centrado -->
  <div class="logo-container">
    <!-- El logo se encuentra en: resources/images/logo.png -->
    <img src="resources/images/logo.png" alt="Logo de la aplicación">
  </div>

  <!-- Mensaje central "MENU PRINCIPAL" -->
  <div class="menu-principal"></div>

  <!-- Contenedor de navegación -->
  <div class="navigation">
    <ul class="oe_menu">
      <li><a href="realizarPedido/realizadPedido.html">Realizar pedidos</a></li>
      <li><a href="gestionPedidos/pedidos.html">Gestión de Pedidos</a></li>
    </ul>
    <div class="right-menu">
      <button class="menu-button admin-only" id="empresa-button" onclick="window.location.href='empresa/empresaMenu.html'">Empresa</button>
      <button class="menu-button" id="logout-button">Cerrar Sesión</button>
    </div>
  </div>

  <!-- Firebase SDK v8.6.8 -->
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <!-- Archivo de conexión a la base de datos (ubicado en la carpeta database) -->
  <script src="database/connection.js"></script>
  <script>
    // Referencias a elementos del DOM
    const welcomeMessage = document.getElementById('welcome-message');
    const empresaButton = document.getElementById('empresa-button');
    const logoutButton = document.getElementById('logout-button');

    function ajustarMenuSegunRol(rol) {
      // No hay botón de Gestión de Facturas en esta versión
      // Ajusta otros elementos si es necesario
    }

    function verificarUsuario() {
      const usuarioLogueado = localStorage.getItem('usuarioLogueado');
      if (usuarioLogueado) {
        db.collection('usuarios').where('username', '==', usuarioLogueado).limit(1).get()
          .then(querySnapshot => {
            if (!querySnapshot.empty) {
              const userData = querySnapshot.docs[0].data();
              ajustarMenuSegunRol(userData.rol);
              welcomeMessage.textContent = `Bienvenido, ${userData.username}!`;
            } else {
              alert('Usuario no encontrado. Por favor, inicia sesión nuevamente.');
              window.location.href = 'login.html';
            }
          })
          .catch(error => {
            console.error("Error al verificar el usuario: ", error);
            alert('Error al verificar el usuario. Por favor, intenta nuevamente.');
            window.location.href = 'login.html';
          });
      } else {
        window.location.href = 'login.html';
      }
    }

    function cerrarSesion() {
      localStorage.removeItem('usuarioLogueado');
      window.location.href = 'login.html';
    }

    logoutButton.addEventListener('click', cerrarSesion);
    empresaButton.addEventListener('click', function() {
      window.location.href = 'empresa/empresaMenu.html';
    });

    window.onload = verificarUsuario;
  </script>
</body>
</html>
