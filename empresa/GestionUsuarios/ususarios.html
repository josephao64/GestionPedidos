<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Usuarios - SIA</title>

  <!-- Dependencies -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
  <script src="../../database/connection.js"></script>

  <!-- Crypto JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --secondary: #64748b;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --surface: #ffffff;
      --background: #f1f5f9;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --transition: all 0.2s ease;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--background);
      color: var(--text-main);
      margin: 0;
      padding: 0;
    }

    /* Layout */
    .header {
      background: var(--surface);
      padding: 24px 40px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .main-content {
      padding: 32px 40px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      gap: 8px;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 32px;
      width: fit-content;
    }

    .tab-btn {
      padding: 10px 24px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow);
    }

    .tab-btn:hover:not(.active) {
      background: rgba(255, 255, 255, 0.5);
    }

    /* Stats & Chart */
    .dashboard-row {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 24px;
      margin-bottom: 32px;
    }

    .stats-col {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .stat-card {
      background: var(--surface);
      padding: 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .stat-icon {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .stat-info h3 {
      margin: 0;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .stat-info p {
      margin: 4px 0 0 0;
      font-size: 1.75rem;
      font-weight: 700;
    }

    .chart-card {
      background: var(--surface);
      padding: 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Grid Layout for Cards */
    .grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    .item-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid transparent;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
    }

    .item-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
    }

    .user-card-header {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 20px;
    }

    .user-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }

    .user-role-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .item-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin: 0;
    }

    .item-details {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      flex-grow: 1;
    }

    .detail-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }

    .detail-row i {
      width: 16px;
      color: var(--secondary);
      font-size: 0.85rem;
    }

    .item-actions {
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    /* Form Controls */
    .search-area {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 250px;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      border: none;
      transition: var(--transition);
      font-family: inherit;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: #fee2e2;
      color: var(--danger);
    }

    .btn-danger:hover {
      background: var(--danger);
      color: white;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: var(--surface);
      padding: 32px;
      border-radius: 20px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .close-modal {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--secondary);
      cursor: pointer;
    }

    .form-field {
      margin-bottom: 20px;
    }

    .form-field label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .form-field input,
    .form-field select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      box-sizing: border-box;
      transition: var(--transition);
    }

    .form-field input:focus,
    .form-field select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-light);
    }

    .permisos-fieldset {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-top: 10px;
    }

    .permisos-fieldset legend {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--secondary);
      padding: 0 8px;
    }

    .checkbox-group {
      display: grid;
      gap: 12px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .checkbox-item input {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    /* Responsive */
    @media (max-width: 992px) {
      .dashboard-row {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .header {
        padding: 16px 20px;
        flex-direction: column;
        gap: 16px;
        text-align: center;
      }

      .grid-view {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <div style="display: flex; align-items: center; gap: 16px;">
      <i class="fas fa-users-gear" style="font-size: 1.5rem; color: var(--primary);"></i>
      <h1>Control de Accesos</h1>
    </div>
    <button class="btn btn-secondary" onclick="location.href='../../empresa/empresaMenu.html'">
      <i class="fas fa-arrow-left"></i> Regresar
    </button>
  </header>

  <main class="main-content">
    <!-- Tab Navigation -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('resumen')" id="tab-resumen">
        <i class="fas fa-chart-pie"></i> Resumen
      </button>
      <button class="tab-btn" onclick="switchTab('usuarios')" id="tab-usuarios">
        <i class="fas fa-users"></i> Usuarios
      </button>
    </div>

    <!-- Tab: Resumen -->
    <div id="view-resumen" class="tab-view">
      <div class="dashboard-row">
        <div class="stats-col">
          <div class="stat-card">
            <div class="stat-icon" style="background: #e0e7ff; color: #4338ca;">
              <i class="fas fa-user-shield"></i>
            </div>
            <div class="stat-info">
              <h3>Total Usuarios</h3>
              <p id="count-total-users">0</p>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background: #fef3c7; color: #d97706;">
              <i class="fas fa-crown"></i>
            </div>
            <div class="stat-info">
              <h3>Administradores</h3>
              <p id="count-admins">0</p>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background: #ecfdf5; color: #059669;">
              <i class="fas fa-user-tag"></i>
            </div>
            <div class="stat-info">
              <h3>Usuarios Estándar</h3>
              <p id="count-standard">0</p>
            </div>
          </div>
        </div>
        <div class="chart-card">
          <h3 style="margin-top: 0; margin-bottom: 20px; font-size: 1rem; color: var(--text-muted);">Distribución de
            Roles</h3>
          <div style="width: 100%; max-width: 300px;">
            <canvas id="rolesChart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- Tab: Usuarios -->
    <div id="view-usuarios" class="tab-view" style="display: none;">
      <div class="search-area">
        <input type="text" id="userSearchInput" class="search-input" placeholder="Buscar usuario por nombre..."
          onkeyup="filterUsers()">
        <button class="btn btn-primary" onclick="showModal('addUserModal')">
          <i class="fas fa-user-plus"></i> Nuevo Usuario
        </button>
      </div>
      <div id="usersGrid" class="grid-view">
        <!-- Data via JS -->
      </div>
    </div>
  </main>

  <!-- Modal: Agregar/Editar Usuario -->
  <div id="addUserModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="userModalTitle">Nuevo Usuario</h2>
        <button class="close-modal" onclick="closeModal('addUserModal')">&times;</button>
      </div>
      <form id="user-form" onsubmit="handleUserSubmit(event)">
        <input type="hidden" id="user-id">

        <div class="form-field">
          <label for="username">Nombre de Usuario *</label>
          <input type="text" id="username" placeholder="Ej: jlopez" required>
        </div>

        <div class="form-field">
          <label for="password">Contraseña <small id="pass-hint"
              style="font-weight: 400; color: var(--text-muted);">(Solo si desea cambiarla)</small></label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <div class="form-field">
          <label for="rol">Rol del Sistema *</label>
          <select id="rol" required onchange="handleRoleChange()">
            <option value="" disabled selected>Selecciona un Rol</option>
            <option value="administrador">Administrador</option>
            <option value="usuario">Usuario Estándar</option>
            <option value="bodega">Encargado de Bodega</option>
            <option value="view">Solo Visualización</option>
          </select>
        </div>

        <div class="form-field">
          <label for="sucursal">Sucursal Asignada *</label>
          <select id="sucursal" required>
            <option value="" disabled selected>Asignar a Sucursal</option>
          </select>
        </div>

        <fieldset class="permisos-fieldset">
          <legend>Permisos de Gestión de Pedidos y Tareas</legend>
          <div class="checkbox-group">
            <label class="checkbox-item">
              <input type="checkbox" id="permChangeStatus"> Cambiar Estado de Pedido
            </label>
            <label class="checkbox-item">
              <input type="checkbox" id="permEditOrder"> Editar Pedido
            </label>
            <label class="checkbox-item">
              <input type="checkbox" id="permDeleteOrder"> Eliminar Pedido
            </label>
            <label class="checkbox-item">
              <input type="checkbox" id="permDeleteReceipt"> Eliminar Recibo de Caja
            </label>
            <label class="checkbox-item">
              <input type="checkbox" id="permAssignTasks"> Asignar Tareas al Personal
            </label>
          </div>
        </fieldset>

        <fieldset class="permisos-fieldset" style="margin-top: 16px;">
          <legend>Permisos del Sistema de Finanzas</legend>
          <div class="checkbox-group" style="grid-template-columns: 1fr 1fr;">
            <label class="checkbox-item"><input type="checkbox" id="permFinViewHistorial"> Historial de Pagos</label>
            <label class="checkbox-item"><input type="checkbox" id="permFinRegistrarPagos"> Registrar Pagos Efectivo</label>
            <label class="checkbox-item"><input type="checkbox" id="permFinManageSucursales"> Gestionar Sucursales</label>
            <label class="checkbox-item"><input type="checkbox" id="permFinManageProveedores"> Gestionar Proveedores</label>
            <label class="checkbox-item"><input type="checkbox" id="permFinManageUsuarios"> Gestor Interno Usuarios</label>
          </div>
        </fieldset>

        <div style="margin-top: 32px; display: flex; justify-content: flex-end; gap: 12px;">
          <button type="button" class="btn btn-secondary" onclick="closeModal('addUserModal')">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="save-user-btn">Guardar Usuario</button>
        </div>
      </form>
    </div>
  </div>

  <script defer src="ususarios.js"></script>
</body>

</html>
