<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Proveedores y Productos</title>

  <!-- Dependencies -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
  <script src="../../database/connection.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --secondary: #64748b;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --surface: #ffffff;
      --background: #f1f5f9;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --transition: all 0.2s ease;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--background);
      color: var(--text-main);
      margin: 0;
      padding: 0;
    }

    /* Layout */
    .header {
      background: var(--surface);
      padding: 24px 40px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .main-content {
      padding: 32px 40px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      gap: 8px;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 32px;
      width: fit-content;
    }

    .tab-btn {
      padding: 10px 24px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow);
    }

    .tab-btn:hover:not(.active) {
      background: rgba(255, 255, 255, 0.5);
    }

    /* Dashboard View */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--surface);
      padding: 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .stat-icon {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .stat-info h3 {
      margin: 0;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .stat-info p {
      margin: 4px 0 0 0;
      font-size: 1.75rem;
      font-weight: 700;
    }

    /* Grid Layout for Cards */
    .grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    .item-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid transparent;
      transition: var(--transition);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .item-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .item-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0;
      color: var(--text-main);
    }

    .item-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--primary-light);
      color: var(--primary);
    }

    .item-details {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      flex-grow: 1;
    }

    .detail-row {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
    }

    .detail-row i {
      width: 16px;
      color: var(--secondary);
    }

    .item-actions {
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    /* Form Controls */
    .search-area {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 250px;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      border: none;
      transition: var(--transition);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: #fee2e2;
      color: var(--danger);
    }

    .btn-danger:hover {
      background: var(--danger);
      color: white;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: var(--surface);
      padding: 32px;
      border-radius: 20px;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 1.5rem;
    }

    .close-modal {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--secondary);
      cursor: pointer;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-field {
      margin-bottom: 16px;
    }

    .form-field.full {
      grid-column: span 2;
    }

    .form-field label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .form-field input,
    .form-field select,
    .form-field textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      box-sizing: border-box;
    }

    .form-field textarea {
      height: 80px;
      resize: vertical;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header {
        padding: 16px 20px;
        flex-direction: column;
        gap: 16px;
        text-align: center;
      }

      .grid-view {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-field.full {
        grid-column: span 1;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <div style="display: flex; align-items: center; gap: 16px;">
      <i class="fas fa-boxes-stacked" style="font-size: 1.5rem; color: var(--primary);"></i>
      <h1>Catálogo Corporativo</h1>
    </div>
    <button class="btn btn-secondary" onclick="location.href='../empresaMenu.html'">
      <i class="fas fa-arrow-left"></i> Regresar
    </button>
  </header>

  <main class="main-content">
    <!-- Tab Navigation -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('resumen')" id="tab-resumen">
        <i class="fas fa-chart-line"></i> Resumen
      </button>
      <button class="tab-btn" onclick="switchTab('proveedores')" id="tab-proveedores">
        <i class="fas fa-truck-loading"></i> Proveedores
      </button>
      <button class="tab-btn" onclick="switchTab('productos')" id="tab-productos">
        <i class="fas fa-box"></i> Productos
      </button>
    </div>

    <!-- Tab: Resumen -->
    <div id="view-resumen" class="tab-view">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon" style="background: #e0e7ff; color: #4338ca;">
            <i class="fas fa-truck"></i>
          </div>
          <div class="stat-info">
            <h3>Proveedores</h3>
            <p id="count-providers">0</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background: #ecfdf5; color: #047857;">
            <i class="fas fa-boxes-packing"></i>
          </div>
          <div class="stat-info">
            <h3>Productos</h3>
            <p id="count-products">0</p>
          </div>
        </div>
      </div>

      <div style="background: white; padding: 24px; border-radius: 16px; box-shadow: var(--shadow);">
        <canvas id="categoryChart" height="100"></canvas>
      </div>
    </div>

    <!-- Tab: Proveedores -->
    <div id="view-proveedores" class="tab-view" style="display: none;">
      <div class="search-area">
        <input type="text" id="providerSearchInput" class="search-input" placeholder="Buscar proveedor..."
          onkeyup="filterProviders()">
        <button class="btn btn-primary" onclick="showModal('addProviderModal')">
          <i class="fas fa-plus"></i> Nuevo Proveedor
        </button>
      </div>
      <div id="providersGrid" class="grid-view">
        <!-- Data via JS -->
      </div>
    </div>

    <!-- Tab: Productos -->
    <div id="view-productos" class="tab-view" style="display: none;">
      <div class="search-area">
        <input type="text" id="productSearchInput" class="search-input" placeholder="Buscar producto..."
          onkeyup="filterProducts()">
        <select id="productProviderFilter" class="search-input" onchange="filterProducts()" style="max-width: 250px;">
          <option value="">Todos los Proveedores</option>
        </select>
        <button class="btn btn-primary" onclick="showModal('addProductModal')">
          <i class="fas fa-plus"></i> Nuevo Producto
        </button>
      </div>
      <div id="productsGrid" class="grid-view">
        <!-- Data via JS -->
      </div>
    </div>
  </main>

  <!-- Modals -->
  <!-- Add Provider Modal -->
  <div id="addProviderModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Nuevo Proveedor</h2>
        <button class="close-modal" onclick="closeModal('addProviderModal')">&times;</button>
      </div>
      <form id="addProviderForm">
        <div class="form-grid">
          <div class="form-field full">
            <label>Nombre del Proveedor *</label>
            <input type="text" id="providerName" required>
          </div>
          <div class="form-field">
            <label>Teléfono</label>
            <input type="text" id="providerPhone">
          </div>
          <div class="form-field">
            <label>Correo Electrónico</label>
            <input type="email" id="providerEmail">
          </div>
          <div class="form-field full">
            <label>Dirección</label>
            <input type="text" id="providerAddress">
          </div>
          <div class="form-field">
            <label>Vendedor</label>
            <input type="text" id="sellerName">
          </div>
          <div class="form-field">
            <label>Teléfono Vendedor</label>
            <input type="text" id="sellerPhone">
          </div>
          <div class="form-field">
            <label>Método Pago</label>
            <input type="text" id="preferredPaymentMethod">
          </div>
          <div class="form-field">
            <label>Términos</label>
            <input type="text" id="providerPaymentTerms">
          </div>
          <div class="form-field full">
            <label>Notas Adicionales</label>
            <textarea id="additionalNotes"></textarea>
          </div>
        </div>
        <div style="margin-top: 24px; display: flex; justify-content: flex-end; gap: 12px;">
          <button type="button" class="btn btn-secondary" onclick="closeModal('addProviderModal')">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar Proveedor</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit/Add Product Modal -->
  <div id="addProductModal" class="modal">
    <div class="modal-content" style="max-width: 500px;">
      <div class="modal-header">
        <h2 id="productModalTitle">Nuevo Producto</h2>
        <button class="close-modal" onclick="closeModal('addProductModal')">&times;</button>
      </div>
      <form id="productForm">
        <input type="hidden" id="editProductId">
        <div class="form-field">
          <label>Nombre del Producto *</label>
          <input type="text" id="productName" required>
        </div>
        <div class="form-field">
          <label>Presentación *</label>
          <input type="text" id="productPresentation" placeholder="Ej: Fardo 24 unidades" required>
        </div>
        <div class="form-field" id="providerSelectField">
          <label>Proveedor *</label>
          <select id="providerSelect" required>
            <option value="">Seleccione un proveedor</option>
          </select>
        </div>
        <div style="margin-top: 24px; display: flex; justify-content: flex-end; gap: 12px;">
          <button type="button" class="btn btn-secondary" onclick="closeModal('addProductModal')">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar Producto</button>
        </div>
      </form>
    </div>
  </div>

  <script defer src="gestionar.js"></script>
</body>

</html>
