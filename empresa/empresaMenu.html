<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Gestión Corporativa</title>

  <!-- Dependencies -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1e40af;
      --secondary: #64748b;
      --surface: #ffffff;
      --background: #f8fafc;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --item-hover: #eff6ff;
      --radius: 16px;
      --shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--background);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      background: var(--surface);
      padding: 20px 40px;
      box-shadow: 0 1px 3px rgb(0 0 0 / 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Main Content */
    .main-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 32px;
      width: 100%;
      max-width: 1200px;
    }

    /* Menu Card */
    .menu-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 32px;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border: 1px solid transparent;
      position: relative;
      overflow: hidden;
    }

    .menu-card:hover {
      transform: translateY(-8px);
      border-color: var(--primary);
      background: linear-gradient(to bottom, var(--surface), var(--item-hover));
    }

    .icon-circle {
      width: 80px;
      height: 80px;
      background: #e0e7ff;
      color: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 24px;
      transition: var(--transition);
    }

    .menu-card:hover .icon-circle {
      background: var(--primary);
      color: white;
      transform: scale(1.1);
    }

    .card-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 8px 0;
      color: var(--text-main);
    }

    .card-description {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin: 0;
      max-width: 90%;
    }

    /* Decoration */
    .menu-card::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: var(--primary);
      transform: scaleX(0);
      transform-origin: left;
      transition: var(--transition);
    }

    .menu-card:hover::after {
      transform: scaleX(1);
    }

    /* Footer / Back Button area */
    .footer-action {
      padding: 40px;
      text-align: center;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 24px;
      background: white;
      color: var(--text-muted);
      border: 1px solid #cbd5e1;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition);
      box-shadow: 0 2px 4px rgb(0 0 0 / 0.05);
    }

    .btn-back:hover {
      background: var(--text-main);
      color: white;
      border-color: var(--text-main);
      transform: translateY(-2px);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header {
        padding: 16px 20px;
      }

      .brand span {
        display: none;
      }

      /* Hide text on very small screens if needed */
      .main-container {
        padding: 20px;
      }

      .menu-card {
        padding: 24px;
      }

      .icon-circle {
        width: 60px;
        height: 60px;
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="brand">
      <i class="fas fa-layer-group"></i>
      <span>Corporativo</span>
    </div>
    <div class="user-info">
      <a href="../index.html" class="btn-back" style="padding: 8px 16px; font-size: 0.9rem;">
        <i class="fas fa-home"></i> Inicio
      </a>
    </div>
  </header>

  <div class="main-container">
    <div class="dashboard-grid">

      <!-- Card 1: Suppliers & Products -->
      <a href="Empresa,productos/gestionar.html" class="menu-card">
        <div class="icon-circle">
          <i class="fas fa-boxes"></i>
        </div>
        <h3 class="card-title">Proveedores y Productos</h3>
        <p class="card-description">
          Administración de catálogo, inventario y gestión de proveedores.
        </p>
      </a>

      <!-- Card 2: Businesses & Branches -->
      <a href="EmpresasSucursales/empresas.html" class="menu-card">
        <div class="icon-circle">
          <i class="fas fa-building"></i>
        </div>
        <h3 class="card-title">Empresas y Sucursales</h3>
        <p class="card-description">
          Gestión de estructura organizacional, sucursales y plazas.
        </p>
      </a>

      <!-- Card 3: Users -->
      <a href="GestionUsuarios/ususarios.html" class="menu-card">
        <div class="icon-circle">
          <i class="fas fa-users-cog"></i>
        </div>
        <h3 class="card-title">Usuarios</h3>
        <p class="card-description">
          Control de acceso, roles y administración de cuentas.
        </p>
      </a>

    </div>
  </div>

  <div class="footer-action">
    <p style="color: var(--text-muted); font-size: 0.9rem;">&copy; 2026 Gestión Corporativa</p>
  </div>

  <script>
    // Simple animation on load
    document.querySelectorAll('.menu-card').forEach((card, index) => {
      card.style.opacity = '0';
      card.style.transform = 'translateY(20px)';
      setTimeout(() => {
        card.style.transition = 'all 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
        card.style.opacity = '1';
        card.style.transform = 'translateY(0)';
      }, index * 100);
    });
  </script>
</body>

</html>
