<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reporte Avanzado de Salidas</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
  </head>
  <body>
    <div class="container my-4">
      <h1 class="mb-4">Reporte Avanzado de Salidas</h1>
      <!-- Formulario de filtros -->
      <form id="advancedReportForm" class="mb-4">
        <div class="row">
          <div class="col-md-4 mb-3">
            <label for="filterBranch" class="form-label">Sucursal:</label>
            <select id="filterBranch" class="form-select">
              <option value="">Todas</option>
              <!-- Se cargarán las sucursales desde Firestore -->
            </select>
          </div>
          <div class="col-md-4 mb-3">
            <label for="groupBy" class="form-label">Agrupar por:</label>
            <select id="groupBy" class="form-select">
              <option value="none">Ninguno</option>
              <option value="branch">Sucursal</option>
              <option value="category">Categoría</option>
            </select>
          </div>
          <div class="col-md-4 mb-3 d-flex align-items-end">
            <button type="button" class="btn btn-primary w-100" onclick="generateAdvancedReport()">
              Generar Reporte
            </button>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="filterStartDate" class="form-label">Fecha Inicio:</label>
            <input type="date" id="filterStartDate" class="form-control" />
          </div>
          <div class="col-md-6 mb-3">
            <label for="filterEndDate" class="form-label">Fecha Fin:</label>
            <input type="date" id="filterEndDate" class="form-control" />
          </div>
        </div>
        <!-- Botones para configurar exclusión de productos y actualizar precios -->
        <div class="row">
          <div class="col-md-6 mb-3">
            <button
              type="button"
              class="btn btn-secondary w-100"
              data-bs-toggle="modal"
              data-bs-target="#excludeProductsModal"
            >
              Configurar Exclusión de Productos
            </button>
          </div>
          <div class="col-md-6 mb-3">
            <button
              type="button"
              class="btn btn-warning w-100"
              data-bs-toggle="modal"
              data-bs-target="#updatePricesModal"
              onclick="populateUpdatePricesModal()"
            >
              Actualizar Precios de Productos
            </button>
          </div>
        </div>
      </form>
      
      <!-- Spinner de carga -->
      <div id="loadingSpinner" class="text-center my-3" style="display: none;">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
      </div>

      <!-- Área de resultados: gráfico y tabla -->
      <div id="reportResult">
        <canvas id="reportChart" class="mb-4" style="max-height:300px;"></canvas>
        <div class="table-responsive">
          <table class="table table-striped" id="advancedReportTable">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Sucursal</th>
                <th>Producto</th>
                <th>Precio</th>
                <th>Cantidad</th>
                <th>Total</th>
                <th>Usuario</th>
                <th>Comentarios</th>
              </tr>
            </thead>
            <tbody>
              <!-- Se cargarán los datos del reporte -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Modal para Excluir Productos -->
    <div class="modal fade" id="excludeProductsModal" tabindex="-1" aria-labelledby="excludeProductsModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="excludeProductsModalLabel">Excluir Productos</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body" id="excludeProductsCheckboxes">
            <!-- Se generarán dinámicamente las casillas para cada producto -->
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">
              Guardar Exclusiones
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal para Actualizar Precios de Productos -->
    <div class="modal fade" id="updatePricesModal" tabindex="-1" aria-labelledby="updatePricesModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="updatePricesModalLabel">Actualizar Precios de Productos</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body" id="updatePricesContainer">
            <!-- Se generará una lista con cada producto y un input para su precio -->
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" onclick="updatePrices()" data-bs-dismiss="modal">
              Guardar Precios
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Archivo JavaScript para el reporte avanzado -->
    <script src="reporteAvanzado.js"></script>
  </body>
</html>
